<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Beryl Racing</title>
    <link rel="icon" href="data:," />
    <meta name="description" content="Drive Beryl, a classic turquoise Morris Minor, around a track and chase your best lap." />
    <meta name="theme-color" content="#15314b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #15314b;
        --sky: #6ec5e9;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #246b45;
        font-family: 'Nunito', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      /* Two stacked canvases: the Three.js world underneath, the transparent
         Phaser canvas (HUD, touch controls, overlays) on top. Absolute
         positioning is required — as static blocks they would stack vertically.
         Paint order follows document order, so no z-index juggling is needed. */
      #game canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      /* Rotate-to-landscape prompt for portrait mobile */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        color: #fff8e7;
        background: linear-gradient(160deg, #15314b, #246b45);
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      }
      #rotate .phone {
        font-size: 64px;
        animation: rock 1.6s ease-in-out infinite;
      }
      #rotate h1 {
        font-size: clamp(20px, 6vw, 34px);
        margin: 0;
        font-weight: 700;
      }
      #rotate p {
        margin: 0;
        max-width: 24ch;
        font-size: clamp(14px, 4vw, 18px);
        opacity: 0.85;
      }
      @keyframes rock {
        0%, 100% { transform: rotate(-20deg); }
        50% { transform: rotate(70deg); }
      }
      /* Only show the prompt on coarse-pointer (touch) devices in portrait */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff8e7;
        font-family: 'Fredoka', 'Nunito', sans-serif;
        font-size: 22px;
        letter-spacing: 0.04em;
        background: #246b45;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div id="loading">Warming up Beryl…</div>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone">📱</div>
      <h1>Rotate your device</h1>
      <p>Beryl Racing plays best in landscape. Turn your phone sideways to start driving.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
