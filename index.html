<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Beryl Racing 3D</title>
    <link rel="canonical" href="https://gilmore.games/beryl-racing/" />
    <link rel="icon" href="data:," />
    <meta name="description" content="Drive Beryl, a classic turquoise Morris Minor, from behind the wheel and chase your best time." />
    <meta name="theme-color" content="#15314b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #15314b;
        --sky: #6ec5e9;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #246b45;
        font-family: 'Nunito', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      /* Two stacked canvases: the Three.js world underneath, the transparent
         Phaser canvas (HUD, touch controls, overlays) on top. Absolute
         positioning is required — as static blocks they would stack vertically.
         Paint order follows document order, so no z-index juggling is needed. */
      #game canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      /* Rotate-to-landscape prompt for portrait mobile */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        color: #fff8e7;
        background: linear-gradient(160deg, #15314b, #246b45);
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
      }
      #rotate .phone {
        font-size: 64px;
        animation: rock 1.6s ease-in-out infinite;
      }
      #rotate h1 {
        font-size: clamp(20px, 6vw, 34px);
        margin: 0;
        font-weight: 700;
      }
      #rotate p {
        margin: 0;
        max-width: 24ch;
        font-size: clamp(14px, 4vw, 18px);
        opacity: 0.85;
      }
      @keyframes rock {
        0%, 100% { transform: rotate(-20deg); }
        50% { transform: rotate(70deg); }
      }
      /* Only show the prompt on coarse-pointer (touch) devices in portrait */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff8e7;
        font-family: 'Fredoka', 'Nunito', sans-serif;
        font-size: 22px;
        letter-spacing: 0.04em;
        background: #246b45;
        transition: opacity 0.4s ease;
      }
      .coastal-results {
        position: absolute; inset: 0; z-index: 20;
        display: grid; place-items: center; padding: 12px;
        background: #15314b66; color: #fff8e7;
        overflow: auto; touch-action: pan-y;
      }
      .coastal-results-card {
        width: min(100%, 560px); max-height: 100%; overflow: auto;
        border: 3px solid #ffd166; border-radius: 22px;
        background: #15314bf5; padding: 20px; text-align: center;
      }
      .coastal-results h1 { font: 700 clamp(22px, 4vw, 36px) Fredoka, sans-serif; color: #ffd166; margin: 0 0 8px; }
      .coastal-results h2 { font-size: 16px; margin: 14px 0 8px; }
      .coastal-results p { margin: 8px 0; }
      .coastal-result-time { display: block; font-size: 34px; color: #2ec4d6; }
      .coastal-results ol { margin: 8px auto; padding-left: 28px; max-width: 310px; text-align: left; }
      .coastal-current-score { color: #ffd166; }
      .coastal-results label { display: block; margin: 12px 0; }
      .coastal-results input { width: 145px; font: inherit; border-radius: 6px; padding: 8px; border: 2px solid #2ec4d6; }
      .coastal-results button { cursor: pointer; min-height: 44px; margin: 6px; padding: 10px 18px; border: 0; border-radius: 8px; font: 700 18px Fredoka, sans-serif; color: #15314b; background: #ffd166; }
      .coastal-results button:last-child { background: #fff8e7; }
      @media (max-height: 480px) {
        .coastal-results-card { padding: 12px 20px; }
        .coastal-results h1 { font-size: 25px; }
        .coastal-results p, .coastal-results label, .coastal-results ol { margin: 5px 0; }
        .coastal-results ol { margin-inline: auto; }
        .coastal-result-time { font-size: 26px; }
      }
    </style>
  </head>
  <body>
    <div id="loading">Warming up Beryl…</div>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone">📱</div>
      <h1>Rotate your device</h1>
      <p>Beryl Racing plays best in landscape. Turn your phone sideways to start driving.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
