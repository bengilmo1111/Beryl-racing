name: Sunday run

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunday-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  story:
    name: Story and saved continuation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:story
      - run: node playtest/title-layout.mjs
      - run: npm run test:journey
      - name: Upload story interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-run-interface
          path: playtest-out/journey/
          retention-days: 7

  drive:
    name: Drive every story chapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        chapter: [first-box, tea-on-the-hill, a-place-at-the-table, room-for-the-view, the-road-we-choose, next-sunday]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:journey-driving
        env:
          JOURNEY_CHAPTERS: ${{ matrix.chapter }}
      - name: Upload chapter driving evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunday-run-${{ matrix.chapter }}
          path: playtest-out/journey/
          retention-days: 7
