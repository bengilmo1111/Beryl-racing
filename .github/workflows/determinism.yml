name: Determinism

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Deterministic replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate the tree model library
        run: npm run test:tree-art
      # The fast Node guards, before anything that needs a browser. Each of
      # these catches a class of bug that used to reach a screenshot: a road
      # folded through itself, a road index that disagrees with the full scan,
      # and a building, beach or fog band that has drifted from the thing it
      # belongs to. Seconds each, and they fail with the exact course and metric.
      - name: Road geometry
        run: npm run test:track-geometry
      - name: Placement
        run: npm run test:placement
      - name: Eastbourne arrival and alternatives
        run: node playtest/eastbourne-arrival.mjs
      - name: Eastbourne settlement and elevation
        run: node playtest/eastbourne-settlement.mjs
      - name: Eastbourne coast geometry and materials
        run: node playtest/eastbourne-coast.mjs
      - name: Course art geometry
        run: node playtest/course-art.mjs
      - name: Elevated terrain clears every road
        run: node playtest/terrain-clearance.mjs
      - name: Road index
        run: npm run test:road-index
      - name: Car contact with the rendered road
        run: npm run test:road-contact
      - name: Eastbourne coastal recovery and summer trees
        run: node playtest/eastbourne-drive-fixes.mjs
      - name: Arcade driving contract
        run: npm run test:arcade-driving
      - name: Drive Eastbourne alternatives and park
        run: node playtest/eastbourne-routes.mjs
      - name: Verify replay and obstacle baselines
        id: pinned_replay
        run: npm run test:determinism
      # Keep the pinned check failing until intentional gameplay changes are
      # reviewed. Print measured replacements without weakening that gate.
      - name: Measure changed replay baselines for review
        if: failure() && steps.pinned_replay.outcome == 'failure'
        run: RECORD_BASELINES=1 npm run test:determinism
      - name: Engine sound
        run: npm run test:audio
