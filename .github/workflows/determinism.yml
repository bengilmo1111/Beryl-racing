name: Determinism

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Deterministic replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate the tree model library
        run: npm run test:tree-art
      - name: Verify replay and obstacle baselines
        run: npm run test:determinism
