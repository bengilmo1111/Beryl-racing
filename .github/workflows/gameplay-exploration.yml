name: Gameplay exploration
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '25 14 * * *'
permissions:
  contents: read
concurrency:
  group: exploration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  explore:
    name: Explore — ${{ matrix.course }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        course: [eastbourne-dash, manfield, remutaka, otaki]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:driving-trace
      - run: npm run build
      - run: npm run playtest:explore -- ${{ matrix.course }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploration-${{ matrix.course }}
          path: playtest-out/
          retention-days: 14
