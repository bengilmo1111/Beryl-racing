name: Playtest

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: playtest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Read course catalog
    runs-on: ubuntu-latest
    outputs:
      courses: ${{ steps.catalog.outputs.courses }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        run: node playtest/catalog.mjs

  course:
    name: Course — ${{ matrix.course }}
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        course: ${{ fromJSON(needs.catalog.outputs.courses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run course matrix
        run: npm run playtest -- --skip-build --course=${{ matrix.course }} --no-journey --no-mobile
      - name: Upload course artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-${{ matrix.course }}
          path: playtest-out/
          if-no-files-found: warn
          retention-days: 7

  shell:
    name: Mobile shell journey
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run mobile inspection and journey
        run: npm run playtest -- --skip-build --mobile-only --journey
      - name: Upload shell artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-shell
          path: playtest-out/
          if-no-files-found: warn
          retention-days: 7

  report:
    name: Combined report
    if: always()
    needs: [course, shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download partial reports
        uses: actions/download-artifact@v4
        with:
          pattern: playtest-*
          path: playtest-parts/
      - name: Merge reports and artifacts
        run: node playtest/merge-reports.mjs playtest-parts
      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-report
          path: playtest-out/
          if-no-files-found: error
          retention-days: 14
      - name: Update sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- beryl-playtest -->';
            const body = fs.readFileSync('playtest-out/playtest-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Enforce playtest verdict
        run: node -e "const r=require('./playtest-out/playtest-report.json'); if(r.verdict!=='pass') process.exit(1)"
